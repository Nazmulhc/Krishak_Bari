<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Krishak Bari – Member Statement</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5130'/%3E%3Cpath d='M16 6c-5 4-7 9-5 14 2-3 4-5 8-6-3 2-5 5-6 10 6-2 9-8 3-18z' fill='%23d8f0c8'/%3E%3C/svg%3E">
<style>
:root{--g9:#143a22;--g8:#1f5130;--g7:#2a6a41;--g1:#e6f1e8;--g0:#f2f8f3;--amber1:#fbf1df;--red:#b93a32;--red1:#fbe7e5;--blue:#2563a8;--blue1:#e5eef9;
  --bg:#f3f5f1;--card:#fff;--line:#e2e7e1;--text:#1c261f;--muted:#68756c;--soft:#f7f9f6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Nirmala UI",system-ui,-apple-system,Roboto,sans-serif;font-size:15px;color:var(--text);background:var(--bg)}
header{background:linear-gradient(135deg,var(--g9),var(--g8));color:#e7f1e9;padding:22px 16px 56px}
header .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:#d8f0c8;display:grid;place-items:center;flex:none}
header b{font-size:18px;display:block}
header small{color:#a9c7b1}
main{max-width:760px;margin:-40px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 18px rgba(20,40,25,.06);padding:18px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid #d6ddd6;border-radius:10px;background:#fff;text-transform:uppercase}
input:focus{outline:2px solid #b8dcc2;border-color:var(--g7)}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--g8);color:#fff;font-weight:600}
button.ghost{background:#fff;color:var(--g8);border:1px solid var(--line);padding:8px 12px;font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--g1);color:var(--g8);display:grid;place-items:center;font-weight:700;flex:none}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;background:var(--g1);color:var(--g8)}
.pill.Due{background:var(--red1);color:var(--red)}.pill.Advance{background:var(--blue1);color:var(--blue)}.pill.Cancelled{background:#eceeec;color:#6b6f6c}
.due{border-radius:12px;padding:16px;background:var(--red1);border:1px solid #f0c6c1}
.due.clear{background:var(--g0);border-color:#cfe3d4}
.due .amt{font-size:30px;font-weight:800;color:var(--red);letter-spacing:-.5px}
.due.clear .amt{color:var(--g7)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid #eef1ed;vertical-align:top}
tfoot td{font-weight:700;background:var(--soft)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.neg{color:var(--red)}
.sub{font-size:12.5px;color:var(--muted)}
.months{display:flex;flex-wrap:wrap;gap:5px}
.mo{font-size:11px;padding:4px 0;border-radius:6px;width:56px;text-align:center;font-weight:600}
.mo.paid{background:var(--g1);color:var(--g8)}.mo.part{background:var(--amber1);color:#94621a}.mo.due{background:var(--red1);color:var(--red)}.mo.adv{background:var(--blue1);color:var(--blue)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details summary{cursor:pointer;color:var(--g7);font-weight:600;margin-top:4px}
.scroll{overflow-x:auto}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 30px}
@media print{header,button,footer,.noprint{display:none!important}main{margin:0}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header><div class="in"><div class="logo"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M16 4c-6 5-8 11-6 17 2-4 5-6 9-7-4 3-6 6-7 12 7-3 11-10 4-22z" fill="#1f5130"/></svg></div>
  <div><b id="soc">Krishak Bari</b><small id="asof">Member statement</small></div></div></header>
<main id="app"><div class="card">Loading…</div></main>
<footer id="foot"></footer>
<script>
"use strict";
let DATA = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const nf0 = new Intl.NumberFormat("en-IN", {maximumFractionDigits: 0}), nf2 = new Intl.NumberFormat("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
function fmt(n, dash) { n = Math.round((+n || 0) * 100) / 100; if (Math.abs(n) < .005) return dash ? "–" : "0"; const a = Math.abs(n), s = Number.isInteger(a) ? nf0.format(a) : nf2.format(a); return n < 0 ? `(${s})` : s; }
const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const fmtD = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}-${MN[+m - 1]}-${y}`; };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const sha256hex = async t => Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))).map(b => b.toString(16).padStart(2, "0")).join("");
let LIST = [];
const initials = n => String(n).split(/\s+/).filter(w => /^[A-Za-z]/.test(w) && !/^(md|mohammad|mohammed)\.?$/i.test(w)).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";

async function decrypt(box, pin) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: unb64(box.s), iterations: 150000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64(box.i)}, key, unb64(box.d));
  return JSON.parse(new TextDecoder().decode(pt));
}
function loginView(msg) {
  let last = ""; try { last = localStorage.getItem("kb_id") || ""; } catch (e) { }
  $("#app").innerHTML = `<div class="card"><h2>See your statement</h2><div class="muted" style="font-size:14px">Enter the Portal ID and PIN given to you by the society.</div>
    <form id="f"><label for="mid">Portal ID</label><input id="mid" inputmode="text" autocomplete="username" placeholder="Portal ID" value="${esc(last)}">
    <label for="pin">PIN</label><input id="pin" type="password" autocomplete="current-password" placeholder="6 characters">
    <div class="err" id="err">${esc(msg || "")}</div><button style="width:100%;margin-top:6px" type="submit">Open my statement</button></form></div>`;
  $("#f").onsubmit = async e => {
    e.preventDefault();
    const id = $("#mid").value.trim().toUpperCase(), pin = $("#pin").value.trim().toUpperCase();
    $("#err").textContent = "Opening…";
    const boxes = (DATA.logins || {})[await sha256hex("KB|" + id)] || [];
    for (const box of boxes) {
      try { const r = await decrypt(box, pin); try { localStorage.setItem("kb_id", id); } catch (x) { } LIST = r.members; return LIST.length === 1 ? show(LIST[0]) : pick(); } catch (x) { }
    }
    $("#err").textContent = "Portal ID or PIN is not correct.";
  };
  (last ? $("#pin") : $("#mid")).focus();
}
function pick() {
  $("#app").innerHTML = `<div class="card"><h2>Choose your name</h2><input id="q" placeholder="Search name or SL" style="text-transform:none" oninput="pickList()"><div id="plist" style="margin-top:10px"></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="loginView()">Log out</button></div></div>`;
  pickList(); window.scrollTo(0, 0);
}
function pickList() {
  const q = ($("#q") ? $("#q").value : "").toLowerCase();
  $("#plist").innerHTML = LIST.map((m, i) => [m, i]).filter(([m]) => !q || (m.name + " " + m.sl + " " + m.id).toLowerCase().includes(q)).map(([m, i]) =>
    `<div onclick="show(LIST[${i}])" style="display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid #eef1ed;cursor:pointer"><div class="avatar" style="width:38px;height:38px;font-size:13px">${initials(m.name)}</div><div style="flex:1"><b>${esc(m.name)}</b><div class="sub">${m.sl ? "SL " + esc(m.sl) + " · " : ""}${m.shares} share${m.shares > 1 ? "s" : ""}</div></div><span class="pill ${m.status}">${m.due > .005 ? "Due Tk " + fmt(m.due) : m.status}</span></div>`).join("") || `<div class="muted">No match</div>`;
}
function show(m) {
  const due = m.due > .005;
  $("#app").innerHTML = `
  <div class="card"><div class="row"><div class="avatar">${initials(m.name)}</div><div><b style="font-size:17px">${esc(m.name)}</b><div class="muted" style="font-size:13px">Member ID ${esc(m.id)}${m.sl ? " · SL " + esc(m.sl) : ""} · ${m.shares} share${m.shares > 1 ? "s" : ""} · Tk ${fmt(m.monthly)}/month</div></div><span class="sp"></span><span class="pill ${m.status}">${m.status}</span></div></div>
  <div class="card"><div class="due ${due ? "" : "clear"}"><div class="muted" style="font-size:13px">Your due as on ${fmtD(DATA.asOn)}</div><div class="amt">${due ? "Tk " + fmt(m.due) : "No due"}</div>
    ${m.adv > .005 ? `<div style="margin-top:4px"><span class="pill Advance">Paid in advance Tk ${fmt(m.adv)}</span></div>` : ""}
    <div style="margin-top:6px;font-size:14px">${m.paidTill ? "Subscription paid till <b>" + esc(m.paidTill) + "</b>" : ""}${m.dueMonths ? ` · <span class="neg">${m.dueMonths} month${m.dueMonths > 1 ? "s" : ""} due: ${esc(m.dueText)}</span>` : ""}</div></div>
    <h2 style="margin-top:16px">Breakdown</h2><div class="scroll"><table><thead><tr><th>Particulars</th><th class="num">Demand</th><th class="num">Paid</th><th class="num">Due</th></tr></thead><tbody>
    ${m.B.map(b => `<tr><td>${esc(b.l)}${b.x ? `<div class="sub">${esc(b.x)}</div>` : ""}</td><td class="num">${fmt(b.d, 1)}</td><td class="num">${fmt(b.p, 1)}</td><td class="num ${b.u > 0 ? "neg" : ""}"><b>${fmt(b.u, 1)}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${fmt(m.B.reduce((a, b) => a + b.d, 0))}</td><td class="num">${fmt(m.B.reduce((a, b) => a + b.p, 0))}</td><td class="num">${fmt(m.B.reduce((a, b) => a + b.u, 0))}</td></tr></tfoot></table></div>
    ${DATA.bank ? `<div class="sub" style="margin-top:10px">Pay to: <b>${esc(DATA.bank)}</b> A/C <b>${esc(DATA.ac)}</b>${DATA.treasurer ? " or to " + esc(DATA.treasurer) : ""}. Please send the payment slip / reference.</div>` : ""}</div>
  ${m.chips && m.chips.length ? `<div class="card"><h2>Subscription months</h2><div class="months">${m.chips.map(c => `<span class="mo ${c[1]}">${esc(c[0])}</span>`).join("")}</div>
    <div class="legend"><span><i style="background:var(--g1)"></i>Paid</span><span><i style="background:var(--amber1)"></i>Part paid</span><span><i style="background:var(--red1)"></i>Due</span><span><i style="background:var(--blue1)"></i>Paid ahead</span></div></div>` : ""}
  <div class="card"><h2>Your payments</h2><div class="scroll"><table><thead><tr><th>Date</th><th>For</th><th class="num">Amount</th></tr></thead><tbody>
    ${m.rows.map(r => `<tr><td style="white-space:nowrap">${fmtD(r.d)}<div class="sub">${esc(r.v)}</div></td><td>${esc(r.l)}<div class="sub">${esc(r.t)}</div></td><td class="num ${r.a < 0 ? "neg" : ""}">${fmt(r.a)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="2">Total paid</td><td class="num">${fmt(m.rows.reduce((a, r) => a + r.a, 0))}</td></tr></tfoot></table></div>
    ${m.old && m.old.length ? `<details style="margin-top:12px"><summary>Earlier payments (old books, ${m.old.length} entries)</summary><div class="scroll"><table><tbody>${m.old.map(r => `<tr><td style="white-space:nowrap">${fmtD(r.d)}</td><td>${esc(r.l)}<div class="sub">${esc(r.t)}</div></td><td class="num ${r.a < 0 ? "neg" : ""}">${fmt(r.a)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}</div>
  <div class="row noprint" style="justify-content:center;margin-top:6px">${LIST.length > 1 ? `<button class="ghost" onclick="pick()">Choose another name</button>` : ""}<button class="ghost" onclick="window.print()">Print / save PDF</button><button class="ghost" onclick="loginView()">Log out</button></div>`;
  window.scrollTo(0, 0);
}
(async () => {
  try {
    DATA = await (await fetch("data.json?v=" + Date.now(), {cache: "no-store"})).json();
    $("#soc").textContent = DATA.society || "Krishak Bari";
    $("#asof").textContent = "Member statement · updated " + fmtD(DATA.asOn);
    document.title = (DATA.short || "Krishak Bari") + " – Member Statement";
    $("#foot").textContent = `${DATA.society} · figures as on ${fmtD(DATA.asOn)} · published ${DATA.published || ""}. Questions about your account? Contact the society.`;
    loginView();
  } catch (e) { $("#app").innerHTML = `<div class="card">The statement page could not load. Please try again later.</div>`; }
})();
</script>
</body>
</html>
